; ProCaller manual-calling dialplan — isolated from VICIdial VDAD/8368

[procaller-agent]
; Autodial / conference rooms (kept for later)
exten => _pc.,1,NoOp(ProCaller conference ${EXTEN} from ${CHANNEL})
 same => n,Answer()
 same => n,ConfBridge(${EXTEN},procaller_bridge,procaller_user)
 same => n,Hangup()

; Manual 1:1 — answer WebRTC first so DTLS is up, then pass real GSM/SIM ringback in-band
; MixMonitor captures ringback + talk even if the customer never answers
exten => _X.,1,NoOp(ProCaller manual ${EXTEN} from ${CHANNEL})
 same => n,Progress()
 same => n,Answer()
 same => n,Set(PCALLID=${SIP_HEADER(X-ProCaller-Call-Id)})
 same => n,ExecIf($["${PCALLID}" != ""]?MixMonitor(/var/spool/asterisk/monitor/pc-${PCALLID}.wav,b))
 same => n,Dial(SIP/gsm222/${EXTEN},60,tTo)
 same => n,Hangup()

[procaller-outbound]
; Internal ProCaller WebRTC extensions
exten => _21XX,1,NoOp(ProCaller internal SIP ${EXTEN})
 same => n,Dial(SIP/${EXTEN},60,tT)
 same => n,Hangup()

; Existing VICIdial chan_sip phones
exten => _1XXX,1,NoOp(ProCaller internal SIP ${EXTEN})
 same => n,Dial(SIP/${EXTEN},60,tT)
 same => n,Hangup()

; PSTN via existing gsm222 gateway
exten => _X.,1,NoOp(ProCaller PSTN ${EXTEN})
 same => n,Set(CALLERID(name)=${CALLERID(name)})
 same => n,Dial(SIP/gsm222/${EXTEN},60,tTo)
 same => n,Hangup()
