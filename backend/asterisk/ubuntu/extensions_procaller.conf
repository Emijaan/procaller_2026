; ProCaller Ubuntu dialplan — PJSIP WebRTC + gsm222 trunk

[procaller-agent]
; *551 ext listen, *552 whisper, *553 interrupt. Supervisor dials this from the browser.
exten => _*551XXXX,1,NoOp(ProCaller listen ${EXTEN:4})
 same => n,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN:4},q)
 same => n,Hangup()

exten => _*552XXXX,1,NoOp(ProCaller whisper ${EXTEN:4})
 same => n,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN:4},qw)
 same => n,Hangup()

exten => _*553XXXX,1,NoOp(ProCaller barge ${EXTEN:4})
 same => n,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN:4},qW)
 same => n,Hangup()

exten => _pc.,1,NoOp(ProCaller conference ${EXTEN})
 same => n,Answer()
 same => n,ConfBridge(${EXTEN},procaller_bridge,procaller_user)
 same => n,Hangup()

exten => _X.,1,NoOp(ProCaller manual ${EXTEN})
 same => n,Progress()
 same => n,Answer()
 same => n,Set(PCALLID=${PJSIP_HEADER(X-ProCaller-Call-Id)})
 same => n,ExecIf($["${PCALLID}"=""]?Set(PCALLID=${SIP_HEADER(X-ProCaller-Call-Id)}))
 same => n,ExecIf($["${PCALLID}"!=""]?MixMonitor(/var/spool/asterisk/monitor/pc-${PCALLID}.wav,b))
 same => n,Dial(PJSIP/${EXTEN}@gsm222,60,tTo)
 same => n,UserEvent(ProCallerDial,Status: ${DIALSTATUS},Cause: ${HANGUPCAUSE},Token: ${CALLERID(name)})
 same => n,Hangup()

[procaller-outbound]
exten => _21XX,1,NoOp(ProCaller internal ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},60,tT)
 same => n,Hangup()

exten => _X.,1,NoOp(ProCaller PSTN ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@gsm222,60,tTo)
 same => n,UserEvent(ProCallerDial,Status: ${DIALSTATUS},Cause: ${HANGUPCAUSE},Token: ${CALLERID(name)})
 same => n,Hangup()

; Load this context before changing the gsm222 endpoint context to procaller-inbound.
[procaller-inbound]
exten => _X.,1,NoOp(ProCaller inbound ${CALLERID(num)} ${EXTEN})
 same => n,Set(PCDEST=${FILTER(0-9,${CURL(http://127.0.0.1:8000/api/telephony/inbound/?caller=${CALLERID(num)}&did=${EXTEN})})})
 same => n,GotoIf($["${PCDEST}"=""]?hangup)
 same => n,Dial(PJSIP/${PCDEST},45,tT)
 same => n(hangup),Hangup()
