; ProCaller PJSIP: WebRTC agents on 8089 + gsm222 gateway
; Set GSM222_HOST before generating contact= below (install script fills this).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8089
external_media_address=103.70.80.14
external_signaling_address=103.70.80.14

[procaller-webrtc](!)
type=endpoint
context=procaller-agent
disallow=all
allow=ulaw
allow=alaw
allow=opus
webrtc=yes
dtls_auto_generate_cert=yes
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
direct_media=no
transport=transport-ws
rtp_timeout=60

[2100](procaller-webrtc)
auth=2100
aors=2100
[2100]
type=auth
auth_type=userpass
username=2100
password=2100
[2100]
type=aor
max_contacts=3
remove_existing=yes

