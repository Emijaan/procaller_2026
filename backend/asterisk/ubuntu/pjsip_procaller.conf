; --- gsm222 Synway. Installer rewrites contact= from GSM222_HOST ---
; context is procaller-inbound so a SIM callback is not dialed back out.
[gsm222]
type=endpoint
transport=transport-udp
context=procaller-inbound
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
aors=gsm222
from_user=gsm222

[gsm222]
type=aor
contact=sip:GSM222_HOST:5060
qualify_frequency=30

[gsm222]
type=identify
endpoint=gsm222
match=GSM222_HOST
