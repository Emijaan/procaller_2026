; ProCaller WebRTC agents — isolated from VICIdial chan_sip 1000-1020
; Loaded via #include in pjsip.conf

[procaller-webrtc](!)
type=endpoint
context=procaller-agent
disallow=all
allow=opus
allow=ulaw
allow=alaw
webrtc=yes
dtls_auto_generate_cert=yes
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
direct_media=no
transport=transport-wss

[2100](procaller-webrtc)
auth=2100
aors=2100
[2100]
type=auth
auth_type=userpass
username=2100
password=2100
[2100]
type=aor
max_contacts=3
remove_existing=yes

[2101](procaller-webrtc)
auth=2101
aors=2101
[2101]
type=auth
auth_type=userpass
username=2101
password=2101
[2101]
type=aor
max_contacts=3
remove_existing=yes

[2102](procaller-webrtc)
auth=2102
aors=2102
[2102]
type=auth
auth_type=userpass
username=2102
password=2102
[2102]
type=aor
max_contacts=3
remove_existing=yes
