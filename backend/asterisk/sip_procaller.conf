; ProCaller WebRTC agents on chan_sip (this box's /ws is owned by chan_sip)

[2100]
type=friend
host=dynamic
secret=2100
context=procaller-agent
nat=force_rport,comedia
directmedia=no
disallow=all
allow=ulaw
allow=alaw
dtmfmode=rfc2833
progressinband=never
encryption=yes
avpf=yes
icesupport=yes
rtcp_mux=yes
dtlsenable=yes
dtlsverify=no
dtlscertfile=/etc/asterisk/keys/procaller.pem
dtlsprivatekey=/etc/asterisk/keys/procaller.pem
dtlssetup=actpass
force_rport=yes
rewrite_contact=yes
qualify=no
transport=ws,wss,udp

[2101](2100)
secret=2101

[2102](2100)
secret=2102
